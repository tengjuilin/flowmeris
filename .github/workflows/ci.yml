name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Fetch large fixtures (SHA-256 verified)
        run: node tools/fetch-fixtures.mjs
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build:site

  e2e:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/

  golden-drift:
    # Regenerates golden fixtures with the pinned FlowKit environment and fails if they changed.
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: node tools/fetch-fixtures.mjs
      - run: cp -r fixtures/golden "$RUNNER_TEMP/golden-committed"
      - run: uv run --project tools/golden/python --python 3.12 python tools/golden/python/generate.py
      - name: Golden values unchanged (float tolerance 1e-9; manifest excluded)
        run: node tools/golden/compare.mjs "$RUNNER_TEMP/golden-committed" fixtures/golden
